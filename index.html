:root,:root[data-theme=light]{
  --raspberry:#d0275f;--periwinkle:#6e77a2;--green:#264f4c;--cream:#e9dabc;
  --f-display:"Yeseva One",Georgia,"Times New Roman",serif;
  --f-script:"Lobster","Brush Script MT",cursive;
  --bg:#e9dabc;--card:#f4ecd6;--text:#264f4c;--hint:#4a6360;
  --accent:#d0275f;--accent-text:#fff8e8;--link:#b01f50;--danger:#b01f50;
  --on:#264f4c;--on-text:#f4ecd6;--line:#264f4c;--shadow:#264f4c;--soft:rgba(38,79,76,.1);
  --chart1:#d0275f;--chart2:#6e77a2;--script:#264f4c;--wm:#6e77a2;--stripe3:#264f4c;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#162f2d;--card:#264f4c;--text:#e9dabc;--hint:#b9b59f;
  --accent:#d0275f;--accent-text:#fff8e8;--link:#f26b98;--danger:#f26b98;
  --on:#e9dabc;--on-text:#162f2d;--line:rgba(233,218,188,.45);--shadow:rgba(0,0,0,.4);--soft:rgba(233,218,188,.12);
  --chart1:#f26b98;--chart2:#9aa3d1;--script:#e9dabc;--wm:#8f98c6;--stripe3:#e9dabc;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:88px}
body.lock{overflow:hidden}
#app{padding:14px 14px 0;max-width:640px;margin:0 auto;position:relative}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;margin:6px 0 14px}
h1::after{content:"";display:block;width:58px;height:10px;margin-top:7px;border-radius:5px;background:linear-gradient(to bottom,var(--raspberry) 0 33.3%,var(--periwinkle) 33.3% 66.6%,var(--stripe3) 66.6% 100%)}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:3px 3px 0 var(--shadow)}
.hint{color:var(--hint);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
button{font:inherit;font-weight:600;border:2px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--accent);color:var(--accent-text);cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
button:active{transform:translate(2px,2px);box-shadow:none}
button.ghost,button.danger,button.ic{background:transparent;border-color:transparent;box-shadow:none;padding:6px 8px}
button.ghost{color:var(--link)}
button.danger{color:var(--danger)}
button.ic{color:var(--hint);font-size:18px;line-height:1}
button.sec{background:var(--bg);color:var(--text)}
button.full{width:100%}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--raspberry);box-shadow:0 0 0 2px rgba(208,39,95,.25)}
input::placeholder,textarea::placeholder{color:var(--hint);opacity:.7}
.set{display:grid;grid-template-columns:24px 1fr 1fr 34px;gap:8px;align-items:center;margin:6px 0}
.set .n{color:var(--hint);text-align:center;font-size:14px;font-weight:700}
.set input{text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:2px solid var(--line);z-index:20}
.tabs button{flex:1;background:transparent;border:0;box-shadow:none;color:var(--hint);padding:6px 2px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--link)}
.tabs button.on span{filter:none}
.pills{display:flex;gap:6px;margin:8px 0}
.pills button{flex:1;background:var(--card);color:var(--text);padding:8px 4px;font-size:13px;box-shadow:none;border-color:var(--line)}
.pills button.on{background:var(--on);color:var(--on-text)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;box-shadow:3px 3px 0 var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;margin:2px 0}
.stat.click{cursor:pointer}
.stat.sel{border-color:var(--periwinkle);box-shadow:3px 3px 0 var(--periwinkle)}
canvas{width:100%;height:210px;display:block}
.empty{text-align:center;color:var(--hint);padding:22px 10px}
.empty img.mas{display:block;width:104px;height:auto;margin:0 auto 10px}
.badge{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--hint);margin:3px 4px 0 0}
.pr{color:var(--link);font-weight:700}
.sp{height:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 8px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);color:var(--text);border:1.5px solid var(--line);padding:6px 12px;border-radius:18px;font-size:14px;box-shadow:none}
.chip.on{background:var(--on);color:var(--on-text)}
.exrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1.5px dashed var(--line);cursor:pointer}
.exrow:last-child{border-bottom:0}
.exrow b{font-weight:700}
.sechd{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin:16px 2px 8px}
.ov{position:fixed;inset:0;background:rgba(22,47,45,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border:2px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);opacity:.5;margin:0 auto 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label{display:block;font-size:12px;color:var(--hint);margin-bottom:3px}
details summary{cursor:pointer;padding:6px 0;font-weight:700}
details .hint{margin:2px 0 2px 4px}
.sheet .exrow{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.sheet .card{background:var(--card)}
.brand{position:relative;display:flex;align-items:center;gap:10px;padding:0 88px 14px 0;min-height:78px}
.brand .logo{width:48px;height:auto;flex:none}
.wmw{position:relative;display:inline-block;line-height:1;padding-bottom:14px}
.wm{display:block;font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.01em;color:var(--wm)}
.wms{position:absolute;left:10px;bottom:-4px;font-family:var(--f-script);font-size:25px;line-height:1;color:var(--script);transform:rotate(-6deg);white-space:nowrap;text-shadow:1.5px 0 0 var(--bg),-1.5px 0 0 var(--bg),0 1.5px 0 var(--bg),0 -1.5px 0 var(--bg),1px 1px 0 var(--bg),-1px -1px 0 var(--bg),1px -1px 0 var(--bg),-1px 1px 0 var(--bg)}
.brand .tg{margin-left:auto;width:34px;height:34px;padding:0;border-radius:50%;background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none;font-size:15px}
.rb{position:absolute;right:-14px;top:-14px;width:104px;height:104px;pointer-events:none}
.banner{display:flex;gap:12px;align-items:center}
.banner img{width:62px;height:auto;flex:none}
.banner b{font-family:var(--f-display);font-weight:400;font-size:1.25em;text-transform:uppercase;letter-spacing:.02em}
input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;accent-color:var(--raspberry)}
input[type=time]{min-width:0}
label.row{cursor:pointer;margin:6px 0}
.meter{height:16px;border:2px solid var(--line);border-radius:9px;background:var(--bg);margin:10px 0;overflow:hidden}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--raspberry) 0 9px,var(--periwinkle) 9px 18px);transition:width .3s}
.brand .tg+.tg{margin-left:0}
.card.ss{border-left:8px solid var(--raspberry)}
.set.drop{background:var(--soft);border-radius:10px;padding:2px 4px}
.set .n[data-act]{cursor:pointer}
.fg{display:block;width:100%;height:auto;fill:none;stroke:var(--text);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fg .hd{fill:var(--card)}.fg .hl{stroke:var(--raspberry)}.fg .pr{stroke:var(--periwinkle);stroke-width:4}.fg .fl{stroke:var(--text);stroke-width:2;opacity:.35}.fg .ar{stroke:var(--periwinkle);stroke-width:3}
.thumb{width:72px;flex:none;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px}
#focus{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
#focus.on{display:flex}
.fbar{height:12px;border:2px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.fbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--raspberry) 0 9px,var(--periwinkle) 9px 18px);transition:width .3s}
.fk{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.fnum{font-family:var(--f-display);font-weight:400;font-size:96px;line-height:1.1;text-align:center;border:0;background:transparent;box-shadow:none;width:100%;padding:0;margin:6px 0;color:var(--text)}
.fnum:focus{box-shadow:none;border:0}
.fstep{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.fstep button{padding:14px 0;font-size:18px}
.fgo{padding:16px;font-size:26px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease-out}
</style>
</head>

function applyTheme(t) {
  theme = t; document.documentElement.dataset.theme = t;
  if (tg) {
    try { tg.setHeaderColor(THEME_BG[t]); } catch(e){}

}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmtDate = s => { const [y,m,d] = s.split('-'); return d + '.' + m + '.' + y.slice(2); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const e1rm = (w, r) => r > 0 ? w * (1 + r / 30) : 0;
const haptic = t => { try { tg && tg.HapticFeedback.impactOccurred(t || 'light'); } catch(e){} };
const confirmBox = (msg, cb) => {
  if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) tg.showConfirm(msg, ok => ok && cb());
  else if (confirm(msg)) cb();
};

function cloudGet(keys) {
  return new Promise(res => cloud.getItems(keys, (err, v) => res(err ? null : v)));
}
async function loadAll() {
  try { const l = JSON.parse(localStorage.getItem(KEY) || 'null'); if (l) db = Object.assign(db, l); } catch(e){}
  if (cloud) {
    try {
      const m = await cloudGet(['n']);
      const n = m && parseInt(m.n);
      if (n) {
        const keys = Array.from({length: n}, (_, i) => 'd' + i);
        const parts = await cloudGet(keys);
        const raw = keys.map(k => parts[k] || '').join('');
        const c = JSON.parse(raw);
        if (c && c.ts > db.ts) { db = Object.assign({ programs: [], workouts: [], active: null, body: [], custom: [] }, c); localStorage.setItem(KEY, JSON.stringify(db)); }
      }
    } catch(e){}
  }
  fixDb();
}
let saveTimer = null;
function save() {
  db.ts = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){}
  if (!cloud) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const raw = JSON.stringify(db), size = 3500, n = Math.ceil(raw.length / size);
    if (n > 200) return;
    for (let i = 0; i < n; i++) cloud.setItem('d' + i, raw.slice(i * size, (i + 1) * size), () => {});
    cloud.setItem('n', String(n), () => {});

}

function ssPos(arr) {
  const out = arr.map(() => null); let i = 0;
  while (i < arr.length) {
    let j = i; while (arr[i].ss && j + 1 < arr.length && arr[j + 1].ss === arr[i].ss) j++;
    if (j > i) for (let k = i; k <= j; k++) out[k] = { pos: k - i + 1, len: j - i + 1 };
    i = j + 1;
  }
  return out;
}
function toggleSS(a, i) {
  if (i <= 0) return; const p = a[i - 1], c = a[i];
  if (p.ss && p.ss === c.ss) c.ss = ''; else { const id = p.ss || 's' + uid(); p.ss = id; c.ss = id; }
}
const dropW = w => w > 0 ? (w >= 20 ? Math.round(w * 0.8 / 2.5) * 2.5 : Math.round(w * 0.8)) : 0;
function repRange(t) {
  t = String(t || ''); const time = /сек/i.test(t), m = t.match(/(\d+)\s*[-–]\s*(\d+)/);
  if (m) return { lo: +m[1], hi: +m[2], time };
  const s = t.match(/×\s*(\d+)/); if (s) return { lo: +s[1], hi: +s[1], time };
  return { lo: 8, hi: 12, time };
}
function suggestFor(e) {
  const rg = repRange(e.target), ex = getEx(e.name), prev = lastSets(e.name, null);
  const time = rg.time || !!(ex && ex.p === 'corestab'), work = prev ? prev.filter(s => !s.d && s.r > 0) : [];
  const out = { lo: rg.lo, hi: rg.hi, time, w: 0, reps: Math.round((rg.lo + rg.hi) / 2), note: '' };
  if (!work.length) { out.note = time ? 'Новое упражнение: засеките комфортное время.' : `Новое упражнение: подберите вес на ${rg.lo}–${rg.hi} повторений.`; return out; }
  const topW = Math.max(...work.map(s => s.w)), minR = Math.min(...work.filter(s => s.w === topW).map(s => s.r));
  const inc = !ex ? 2.5 : ex.e === 'dumbbell' ? 2 : (ex.e === 'barbell' && (ex.g === 'quads' || ex.g === 'hams')) ? 5 : 2.5;
  out.w = topW;
  if (time) { out.reps = minR + 5; out.note = `Прошлый раз ${minR} сек. Попробуйте ${out.reps}.`; }
  else if (topW === 0) { out.reps = minR + 1; out.note = `Свой вес, прошлый раз ${minR}. Цель ${out.reps}.`; }
  else if (minR >= rg.hi) { out.w = topW + inc; out.reps = rg.lo; out.note = `Прогресс: все подходы на ${minR}. Берём ${fmt(out.w)} кг.`; }
  else { out.reps = Math.min(rg.hi, Math.max(rg.lo, minR + 1)); out.note = minR >= rg.lo ? `Вес прежний, цель ${out.reps} повторений.` : `Вес прежний, добейте до ${rg.lo} повторений.`; }
  return out;
}

function similar(ex) {
  const rest = allEx().filter(x => x.name !== ex.name);
  const a = ex.p ? rest.filter(x => x.p === ex.p) : [];
  const b = rest.filter(x => x.g === ex.g && !a.includes(x));
  return a.concat(b);
}

const sortedWorkouts = () => db.workouts.slice().sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
const exNames = () => {
  const s = new Set(allEx().map(x => x.name));
  db.programs.forEach(p => p.exercises.forEach(e => e.name && s.add(e.name.trim())));
  db.workouts.forEach(w => w.entries.forEach(e => s.add(e.name)));
  return [...s].sort((a, b) => a.localeCompare(b, 'ru'));
};
function lastSets(name, skipId) {
  const key = name.trim().toLowerCase();
  for (const w of sortedWorkouts()) {
    if (w.id === skipId) continue;
    const e = w.entries.find(x => x.name.trim().toLowerCase() === key);
    if (e && e.sets.length) return e.sets;
  }
  return null;
}
const setsText = sets => sets.map(s => (s.d ? '↓' : '') + fmt(s.w) + '×' + s.r).join(', ');

/* ---------- прогресс ---------- */
function exSeries(name) {
  const key = name.trim().toLowerCase(), pts = [];
  db.workouts.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(w => {
    const e = w.entries.find(x => x.name.trim().toLowerCase() === key);
    if (!e || !e.sets.length) return;
    pts.push({
      date: w.date,
      w: Math.max(...e.sets.map(s => s.w)),
      r: Math.max(...e.sets.map(s => s.r)),
      e: Math.max(...e.sets.map(s => e1rm(s.w, s.r))),
      v: e.sets.reduce((q, s) => q + s.w * s.r, 0)
    });
  });
  return pts;
}
function weekStart(d) { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); x.setHours(0,0,0,0); return x; }

function viewProgress() {
  const tabs = `<div class="pills"><button class="${ui.ptab === 'strength' ? 'on' : ''}" data-act="ptab" data-v="strength">Силовые</button><button class="${ui.ptab === 'body' ? 'on' : ''}" data-act="ptab" data-v="body">Тело</button><button class="${ui.ptab === 'health' ? 'on' : ''}" data-act="ptab" data-v="health">Здоровье</button></div>`;
  return '<h1>Прогресс</h1>' + tabs + (ui.ptab === 'body' ? viewBody() : ui.ptab === 'health' ? viewHealth() : viewStrength());
}

function viewStrength() {
  const names = exNames().filter(n => exSeries(n).length);

  const total = db.workouts.length;
  if (!total) return emptyBox('Нужна хотя бы одна завершённая тренировка.');
  const ws = weekStart(new Date());
  const thisWeek = db.workouts.filter(w => new Date(w.date + 'T00:00:00') >= ws).length;
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const vol30 = db.workouts.filter(w => new Date(w.date + 'T00:00:00') >= d30)
    .reduce((s, w) => s + w.entries.reduce((q, e) => q + e.sets.reduce((z, x) => z + x.w * x.r, 0), 0), 0);
  const pts = ui.pex ? exSeries(ui.pex) : [];
  const best = pts.length ? Math.max(...pts.map(p => p.w)) : 0;
  const bestR = pts.length ? Math.max(...pts.map(p => p.r)) : 0;
  return `<div class="stats">

      <div class="stat"><span class="hint">Объём за 30 дней</span><b>${fmt(vol30 / 1000)} т</b></div>
      <div class="stat"><span class="hint">Рекорд: ${esc(ui.pex || '—')}</span><b class="pr">${best > 0 ? fmt(best) + ' кг' : bestR + ' повт.'}</b></div>
    </div>
    <div class="card"><h2>Тренировки по неделям</h2><canvas id="c-weeks"></canvas></div>
    <div class="card"><h2>По упражнению</h2>
      <select data-f="pex">${names.map(n => `<option ${n === ui.pex ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <div class="pills">
        <button class="${ui.metric === 'w' ? 'on' : ''}" data-act="metric" data-m="w">Макс. вес</button>
        <button class="${ui.metric === 'e' ? 'on' : ''}" data-act="metric" data-m="e">Расч. 1ПМ</button>
        <button class="${ui.metric === 'v' ? 'on' : ''}" data-act="metric" data-m="v">Объём</button>
        <button class="${ui.metric === 'r' ? 'on' : ''}" data-act="metric" data-m="r">Повторы</button>
      </div>

}
function insight(pts, unit) {
  if (pts.length < 2) return 'Для анализа нужно минимум две записи.';
  const a = pts[0].y, b = pts[pts.length - 1].y, diff = b - a, pct = a ? diff / a * 100 : 0;
  return `С ${fmtDate(pts[0].date)} по ${fmtDate(pts[pts.length-1].date)}: ${diff >= 0 ? '+' : '−'}${fmt(Math.abs(diff))} ${unit} (${diff >= 0 ? '+' : '−'}${fmt(Math.abs(pct))}%) за ${pts.length} зап.`;
}

/* ---------- графики ---------- */
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(c) {
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  return { g, w, h };
}
function drawLine(c, pts) {
  if (!c || !pts.length) return;
  const accent = cssv('--chart1') || '#d0275f', hint = cssv('--hint') || '#4a6360', bar = cssv('--chart2') || '#6e77a2';
  const { g, w, h } = setupCanvas(c);
  const vals = pts.map(p => p.y);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mn === mx) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * 0.15; mn -= pad; mx += pad;
  const L = 40, R = 14, T = 14, B = 26;
  const X = i => pts.length === 1 ? (L + w - R) / 2 : L + (w - L - R) * i / (pts.length - 1);
  const Y = v => T + (h - T - B) * (1 - (v - mn) / (mx - mn));
  g.font = '11px sans-serif'; g.fillStyle = hint; g.strokeStyle = cssv('--soft') || 'rgba(128,128,128,.2)'; g.lineWidth = 1.5; g.textAlign = 'right';
  const dec = (mx - mn) < 8;
  for (let i = 0; i < 4; i++) {
    const v = mn + (mx - mn) * i / 3, y = Y(v);
    g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
    g.fillText(dec ? v.toFixed(1).replace('.', ',') : Math.round(v), L - 5, y + 4);
  }
  g.strokeStyle = accent; g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(X(i), Y(p.y)) : g.moveTo(X(i), Y(p.y))); g.stroke();
  g.fillStyle = accent; pts.forEach((p, i) => { g.beginPath(); g.arc(X(i), Y(p.y), 4, 0, 7); g.fill(); });
  g.fillStyle = hint; g.textAlign = 'left'; g.fillText(fmtDate(pts[0].date), L, h - 7);
  g.textAlign = 'right'; g.fillText(fmtDate(pts[pts.length - 1].date), w - R, h - 7);
}
function drawCharts() {
  const accent = cssv('--chart1') || '#d0275f', hint = cssv('--hint') || '#4a6360', bar = cssv('--chart2') || '#6e77a2';
  const c1 = $('#c-weeks');
  if (c1) {
    const { g, w, h } = setupCanvas(c1);
    const base = weekStart(new Date()), weeks = [];
    for (let i = 7; i >= 0; i--) { const d = new Date(base); d.setDate(d.getDate() - i * 7); weeks.push({ d, n: 0 }); }
    db.workouts.forEach(wk => {
      const ws = weekStart(new Date(wk.date + 'T00:00:00')).getTime();
      const f = weeks.find(x => x.d.getTime() === ws); if (f) f.n++;
    });
    const max = Math.max(3, ...weeks.map(x => x.n)), bw = (w - 20) / weeks.length;
    g.font = '12px sans-serif'; g.textAlign = 'center';
    weeks.forEach((x, i) => {
      const bh = (h - 40) * x.n / max, bx = 10 + i * bw + 4;
      g.fillStyle = bar; g.globalAlpha = x.n ? 1 : .18;
      g.fillRect(bx, h - 22 - Math.max(bh, 3), bw - 8, Math.max(bh, 3)); g.globalAlpha = 1;
      g.fillStyle = hint;
      if (x.n) g.fillText(x.n, bx + (bw - 8) / 2, h - 28 - bh);
      g.fillText(String(x.d.getDate()).padStart(2,'0') + '.' + String(x.d.getMonth()+1).padStart(2,'0'), bx + (bw - 8) / 2, h - 6);
    });
  }
  drawLine($('#c-ex'), ui.pex ? exSeries(ui.pex).map(p => ({ date: p.date, y: p[ui.metric] })) : []);
  drawLine($('#c-body'), bodySeries(ui.bm));
}

  },
  fskip() { const f = ui.focus; db.active.entries[f.ei].sets[f.si].skip = 1; save(); focusAfter({ ei: f.ei, si: f.si }, false); },
  frskip() { clearInterval(window._fr); focusEnter(nextSet(db.active)); renderFocus(); },
  frest30() { ui.focus.rest += 30000; renderFocus(); },
  faddset() { const f = ui.focus, e = db.active.entries[f.ei], l = e.sets.filter(x => !x.d).slice(-1)[0]; e.sets.push({ w: l ? l.w : 0, r: 0 }); save(); renderFocus(); haptic(); },
  fcool() { ui.focus = null; ui.cool = { ids: coolFor(activeGroups()), done: {}, ctx: 'active' }; ui.sheet = { t: 'cool' }; render(); },
  ffinish() { ui.focus = null; A.finish(); },
  coolopen(el) { const act = el.dataset.ctx === 'active'; if (!ui.cool || ui.cool.ctx !== el.dataset.ctx) ui.cool = { ids: coolFor(act ? activeGroups() : GENERAL_GROUPS), done: {}, ctx: el.dataset.ctx }; ui.sheet = { t: 'cool' }; renderSheet(); },
  stopen(el) { ui.sheet = { t: 'stretch', i: +el.dataset.i }; renderSheet(); const sh = $('.sheet'); if (sh) sh.scrollTop = 0; },
  stprev() { ui.sheet.i = Math.max(0, ui.sheet.i - 1); renderSheet(); },
  stnext() { ui.sheet.i = Math.min(ui.cool.ids.length - 1, ui.sheet.i + 1); renderSheet(); },
  stdone() { const id = ui.cool.ids[ui.sheet.i]; if (ui.cool.done[id]) delete ui.cool.done[id]; else ui.cool.done[id] = 1; haptic('medium'); if (ui.cool.done[id] && ui.sheet.i < ui.cool.ids.length - 1) ui.sheet.i++; else if (ui.cool.done[id]) ui.sheet = { t: 'cool' }; renderSheet(); },
  sttimer() {
    const x = STRID[ui.cool.ids[ui.sheet.i]];
    if (window._tmOn) { clearInterval(window._tm); window._tmOn = false; const b = $('[data-act=sttimer]'); if (b) b.textContent = 'Старт таймера'; const e = $('#tmr'); if (e) e.textContent = x.hold; return; }
    runTimer(x);
  },
  addset(el) {
    const e = db.active.entries[+el.dataset.ei], l = e.sets[e.sets.length - 1];
    e.sets.push({ w: l ? l.w : 0, r: l ? l.r : 0 }); save(); render(); haptic();
  },
  delset(el) { db.active.entries[+el.dataset.ei].sets.splice(+el.dataset.si, 1); save(); render(); },
  finish() {
    const a = db.active;
    const entries = a.entries.map(e => { const o = { name: e.name, sets: e.sets.filter(s => s.r > 0).map(s => s.d ? { w: s.w, r: s.r, d: 1 } : { w: s.w, r: s.r }) }; if (e.ss) o.ss = e.ss; return o; }).filter(e => e.sets.length);
    if (!entries.length) { alert('Заполните хотя бы один подход (повторения больше нуля).'); return; }
    db.workouts.push({ id: a.id, date: a.date, name: a.name || 'Тренировка', note: a.note, entries, dur: Math.max(1, Math.round((Date.now() - a.start) / 60000)), cool: ui.cool && ui.cool.ctx === 'active' ? Object.keys(ui.cool.done).length : 0 });
    db.active = null; ui.focus = null; ui.cool = null; ui.view = 'history'; ui.just = true; ui.open[a.id] = true; save(); scheduleSync(); render(); window.scrollTo(0, 0);
    try { tg && tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
  },
  cancel() { confirmBox('Отменить тренировку без сохранения?', () => { db.active = null; save(); render(); }); },
  toggle(el) { ui.open[el.dataset.id] = !ui.open[el.dataset.id]; render(); },
  wdel(el) { confirmBox('Удалить запись?', () => { db.workouts = db.workouts.filter(w => w.id !== el.dataset.id); save(); render(); }); },

  pshow(el) { ui.pshow = el.dataset.v; render(); },
  pnew() { ui.edit = { id: '', name: '', exercises: [{ name: '', sets: 3, reps: '8-12' }] }; render(); },
  pedit(el) { const p = db.programs.find(x => x.id === el.dataset.id); ui.edit = JSON.parse(JSON.stringify(p)); render(); },
  pdrop(el) { confirmBox('Удалить программу?', () => { db.programs = db.programs.filter(p => p.id !== el.dataset.id); save(); render(); }); },
  padd() { ui.edit.exercises.push({ name: '', sets: 3, reps: '8-12' }); render(); },
  pdel(el) { ui.edit.exercises.splice(+el.dataset.i, 1); render(); },
  pup(el) { const i = +el.dataset.i, a = ui.edit.exercises; if (i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; render(); } },
  pdown(el) { const i = +el.dataset.i, a = ui.edit.exercises; if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; render(); } },
  picke() { openPick({ ctx: 'edit', mode: 'add' }); },
  swape(el) {
    const i = +el.dataset.i, base = ui.edit.exercises[i].name.trim(), ex = base && getEx(base);
    openPick({ ctx: 'edit', mode: 'replace', idx: i, base: base || null, g: ex && similar(ex).length ? 'sim' : 'all' });
  },
  pcancel() { ui.edit = null; render(); },
  psave() {
    const e = ui.edit; e.name = e.name.trim();
    e.exercises = e.exercises.filter(x => x.name.trim());
    if (!e.name || !e.exercises.length) { alert('Нужно название и хотя бы одно упражнение.'); return; }
    if (e.id) db.programs = db.programs.map(p => p.id === e.id ? e : p); else { e.id = uid(); db.programs.push(e); }
    ui.edit = null; save(); render();
  },
  tpladd(el) {
    const t = TPL.find(x => x.id === el.dataset.id);
    const doAdd = () => {
      t.days.forEach(d => db.programs.push({ id: uid(), grp: t.name, name: d.name, exercises: d.ex.map(([id, s, r]) => ({ name: LIBID[id].name, sets: s, reps: r })) }));
      ui.pshow = 'my'; save(); render(); window.scrollTo(0, 0); haptic('medium');
    };
    if (db.programs.some(p => p.grp === t.name)) confirmBox('Эта программа уже добавлена. Добавить ещё одну копию?', doAdd); else doAdd();
  },

  gby(el) { ui.gf.by = el.dataset.v; ui.gf.key = 'all'; render(); },
  gkey(el) { ui.gf.key = el.dataset.k; render(); },
  exopen(el) { ui.sheet = { t: 'detail', name: el.dataset.name }; renderSheet(); const sh = $('.sheet'); if (sh) sh.scrollTop = 0; },
  addtowork(el) {
    const name = el.dataset.name, pr = lastSets(name, null);
    db.active.entries.push(mkEntry(name, '', 3));
    ui.sheet = null; ui.view = 'today'; save(); render(); window.scrollTo(0, 0); haptic();
  },
  customnew() { const g = ui.gf.key !== 'all' && GROUPS[ui.gf.key] ? ui.gf.key : 'chest'; ui.sheet = { t: 'custom', name: '', g, m: DEF_MOVE[g], e: 'dumbbell' }; renderSheet(); },
  csave() {
    const s = ui.sheet, name = s.name.trim();
    if (!name) { alert('Введите название'); return; }
    if (getEx(name)) { alert('Упражнение с таким названием уже есть'); return; }
    db.custom.push({ id: 'c_' + uid(), name, g: s.g, m: s.m, e: s.e });
    ui.sheet = null; save(); render();
  },
  cdel(el) { confirmBox('Удалить упражнение из галереи? История тренировок сохранится.', () => { db.custom = db.custom.filter(c => c.name !== el.dataset.name); ui.sheet = null; save(); render(); }); },

  pg(el) { ui.sheet.g = el.dataset.k; ui.sheet.q = ''; renderSheet(); },
  pickit(el) {
    const s = ui.sheet, name = el.dataset.name, pr = lastSets(name, null);
    if (s.ctx === 'workout') {
      const a = db.active;
      if (s.mode === 'add') a.entries.push(mkEntry(name, '', 3));
      else { const e = a.entries[s.idx]; e.name = name; e.target = ''; e.sug = suggestFor(e); applySug(e); }
      save();
    } else {
      if (s.mode === 'add') ui.edit.exercises.push({ name, sets: 3, reps: '8-12' });
      else ui.edit.exercises[s.idx].name = name;
    }
    ui.sheet = null; render(); haptic();
  },
  sclose(el, ev) { if (el.classList.contains('ov') && ev.target !== el) return; const hl = ui.sheet && ui.sheet.t === 'labd'; ui.sheet = null; renderSheet(); if (hl) renderBg(); },

  hquick(el) { const r = recEntry(true); r.feel = +el.dataset.v; r.ts = Date.now(); save(); haptic(); render(); },
  hopen() { ui.view = 'progress'; ui.ptab = 'health'; render(); },
  hset(el) { const r = recEntry(true), k = el.dataset.k, v = +el.dataset.v; r[k] = r[k] === v ? 0 : v; r.ts = Date.now(); save(); haptic(); render(); },
  labnew() { ui.lab = { id: '', date: todayStr(), vals: {} }; ui.sheet = { t: 'lab' }; renderSheet(); },
  labedit(el) { const l = db.health.labs.find(x => x.id === el.dataset.id); if (!l) return; ui.lab = { id: l.id, date: l.date, vals: Object.assign({}, l.vals) }; ui.sheet = { t: 'lab' }; renderSheet(); },
  labopen(el) { ui.sheet = { t: 'labd', k: el.dataset.k }; renderSheet(); },
  labdel(el) { confirmBox('Удалить эти анализы?', () => { const l = db.health.labs.find(x => x.id === el.dataset.id); if (l) { l.del = 1; l.ts = Date.now(); } save(); render(); }); },
  labsave() {
    const L = ui.lab, vals = {}; Object.keys(L.vals).forEach(k => { const v = num(L.vals[k]); if (LABID[k] && v > 0) vals[k] = v; });
    if (!L.date || !Object.keys(vals).length) { haptic('heavy'); return; }
    if (L.id) { const l = db.health.labs.find(x => x.id === L.id); if (l) { l.date = L.date; l.vals = vals; l.ts = Date.now(); } }
    else db.health.labs.push({ id: uid(), date: L.date, vals, ts: Date.now() });
    save(); ui.sheet = null; render();
  },
  lrreset(el) { delete db.health.ref[el.dataset.k]; save(); renderSheet(); },
  ptab(el) { ui.ptab = el.dataset.v; render(); },
  metric(el) { ui.metric = el.dataset.m; render(); },
  bmsel(el) { ui.bm = el.dataset.k; render(); },
  bsave() {
    const f = ui.bf, vals = {}; let any = false;
    BM.forEach(([k]) => { const v = num(f[k]); if (v > 0) { vals[k] = v; any = true; } });
    if (!any) { alert('Введите хотя бы одно значение'); return; }
    if (!f.date) { alert('Укажите дату'); return; }
    let e = db.body.find(x => x.date === f.date && !x.del);
    if (!e) { e = { id: uid(), date: f.date }; db.body.push(e); }
    Object.assign(e, vals); e.ts = Date.now();
    ui.bf = newBF(); saveShared(); render(); haptic('medium');
  },
  bdel(el) { confirmBox('Удалить замер?', () => { const e = db.body.find(x => x.id === el.dataset.id); if (e) { e.del = true; e.ts = Date.now(); } saveShared(); render(); }); },

  export() {
    const t = JSON.stringify(db);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Скопировано в буфер обмена'), () => { $('#imp').value = t; alert('Данные помещены в поле ниже, скопируйте вручную'); });
  },
  import() {
    try {
      const d = JSON.parse($('#imp').value);
      if (!Array.isArray(d.workouts) || !Array.isArray(d.programs)) throw 0;
      confirmBox('Заменить текущие данные восстановленными?', () => { db = Object.assign({ active: null }, d); fixDb(); save(); render(); });
    } catch(e) { alert('Не удалось прочитать JSON'); }
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (el && !el.disabled && A[el.dataset.act]) A[el.dataset.act](el, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target, d = t.dataset;
  if (d.f === 'w' || d.f === 'r') { db.active.entries[+d.ei].sets[+d.si][d.f] = num(t.value); save(); }
  else if (d.f === 'aname') { db.active.name = t.value; save(); }
  else if (d.f === 'note') { db.active.note = t.value; save(); }
  else if (d.f === 'gq') { ui.gf.q = t.value; $('#liblist').innerHTML = libListHtml(); }
  else if (d.f === 'pq') { ui.sheet.q = t.value; $('#pl').innerHTML = pickListHtml(); }
  else if (d.f === 'cn') { ui.sheet.name = t.value; }
  else if (d.f === 'st') { let v = t.value; if (d.k === 'waterGoal' || d.k === 'water.every') v = Math.max(0, Math.round(num(v))); setPath(db.settings, d.k, v); touchSettings(); }
  else if (d.f === 'sp') { db.settings.supps[+d.i][d.k] = t.value; touchSettings(); }
  else if (d.f === 'bf') { ui.bf[d.k] = t.value; }
  else if (d.f === 'fval') { if (ui.focus.step === 'w') ui.focus.val = t.value; else ui.focus.rval = t.value; }
  else if (d.f === 'pf') { db.profile[d.k] = t.value; db.profile.ts = Date.now(); save(); refreshProfile(); }
  else if (d.f === 'hr') { const r = recEntry(true); r[d.k] = d.k === 'pulse' ? Math.round(num(t.value)) : num(t.value); r.ts = Date.now(); save(); const h = $('#hready'); if (h) h.innerHTML = readyBlock(); }
  else if (d.f === 'ld') { ui.lab.date = t.value; }
  else if (d.f === 'lv') { ui.lab.vals[d.k] = t.value; }
  else if (d.f === 'lr') { const o = db.health.ref[d.k] = db.health.ref[d.k] || {}; o[d.b] = t.value.trim() === '' ? null : num(t.value); if (o.lo == null && o.hi == null) delete db.health.ref[d.k]; save(); }
  else if (d.f === 'pw') { setTodayWeight(num(t.value)); refreshProfile(); }
  else if (d.pe && ui.edit) {
    if (d.pe === 'name') ui.edit.name = t.value;
    else { const x = ui.edit.exercises[+d.i]; if (d.pe === 'ex') x.name = t.value; else if (d.pe === 'sets') x.sets = t.value; else x.reps = t.value; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target, f = t.dataset.f;
  if (f === 'pex') { ui.pex = t.value; render(); }
  else if (f === 'pdrop') { ui.edit.exercises[+t.dataset.i].drop = t.checked; }
  else if (f === 'blkopen') { db.blocks.opener.on = t.checked; save(); }
  else if (f === 'blkcool') { db.blocks.cool.on = t.checked; save(); }
  else if (f === 'pa') { db.profile.activity = +t.value; db.profile.ts = Date.now(); save(); refreshProfile(); renderBg(); }
  else if (f === 'pf' || f === 'pw') { renderBg(); }
  else if (f === 'stc') { setPath(db.settings, t.dataset.k, t.checked); touchSettings(); }
  else if (f === 'spr') { const p = db.settings.supps[+t.dataset.i]; p.rep = t.value; if (p.rep === 'n' && !p.start) p.start = todayStr(); touchSettings(); renderSheet(); render(); }
  else if (f === 'spn') { db.settings.supps[+t.dataset.i].n = Math.round(num(t.value)); touchSettings(); renderSheet(); render(); }
  else if (f === 'spc') { db.settings.supps[+t.dataset.i].on = t.checked; touchSettings(); render(); }
  else if (f === 'st' && t.tagName === 'SELECT') { setPath(db.settings, t.dataset.k, Math.round(num(t.value))); touchSettings(); }
  else if (f === 'cg') { ui.sheet.g = t.value; ui.sheet.m = DEF_MOVE[t.value]; renderSheet(); }
  else if (f === 'cm') { ui.sheet.m = t.value; }
  else if (f === 'ce') { ui.sheet.e = t.value; }
  else if (f === 'bf') { ui.bf[t.dataset.k] = t.value; }
});
window.addEventListener('resize', () => { if (ui.view === 'progress') drawCharts(); });

loadAll().then(() => {
  if (db.active) ui.view = 'today';
  render();
  if (new URLSearchParams(location.search).get('go') === 'settings') { ui.sheet = { t: 'settings' }; renderSheet(); }
  syncNow();
});
render();
</script>
</body>
</html>
